<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 430px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        /* TOP TABS */
        .tabs {
            display: flex;
            width: 100%;
        }

        .tab {
            width: 50%;
            padding: 17px 10px;
            text-align: center;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
            border: none;
            background: #f7f7f7;
            color: #333;
            transition: 0.3s;
        }

        .tab.active {
            background: #0d6efd;
            color: white;
        }

        .tab:hover {
            background: #0d6efd;
            color: white;
        }

        /* FORM AREA */
        .form-area {
            padding: 32px 38px 35px;
        }

        h2 {
            text-align: center;
            margin-bottom: 28px;
            color: #222;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 16px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 4px rgba(13,110,253,0.25);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #0b5ed7;
        }

        .message {
            text-align: center;
            color: #b02a37;
            margin-bottom: 15px;
        }

        /* Modal profile image */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #0d6efd;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<div class="login-box">

    <!-- TABS -->
    <div class="tabs">

        <button
            type="button"
            id="userTab"
            class="tab active"
            onclick="showUserLogin()">
            👤 User Login
        </button>

        <button
            type="button"
            id="studentTab"
            class="tab"
            onclick="showStudentLogin()">
            🎓 Student Login
        </button>

    </div>


    <div class="form-area">

        <!-- FLASH MESSAGE -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}


        <!-- USER LOGIN -->
        <div id="userLogin">

            <h2>User Login</h2>

            <form
                id="userForm"
                method="POST"
                action="{{ url_for('login') }}"
                onsubmit="showWelcome(event)">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required
                >

                <button class="login-btn" type="submit">
                    Login
                </button>

            </form>

        </div>


        <!-- STUDENT LOGIN -->
        <div id="studentLogin" style="display:none;">

            <h2>Student Login</h2>

            <form
                method="POST"
                action="{{ url_for('student_login') }}">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required
                >

                <button class="login-btn" type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

</div>


<!-- WELCOME MODAL -->
<div class="modal fade" id="welcomeModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-body text-center">

                <img
                    src="{{ url_for('static', filename='images/profile.jpeg') }}"
                    class="profile-img mb-3">

                <h2>Hello 👋</h2>

                <p>
                    Welcome to Student Task Manager Project.<br>
                    Developed by <strong>Avdhut Patil</strong>.
                </p>

                <button
                    class="btn btn-primary"
                    data-bs-dismiss="modal">
                    Continue
                </button>

            </div>

        </div>

    </div>

</div>


<script>

    function showUserLogin() {

        document.getElementById("userLogin").style.display = "block";
        document.getElementById("studentLogin").style.display = "none";

        document.getElementById("userTab").classList.add("active");
        document.getElementById("studentTab").classList.remove("active");
    }


    function showStudentLogin() {

        document.getElementById("userLogin").style.display = "none";
        document.getElementById("studentLogin").style.display = "block";

        document.getElementById("studentTab").classList.add("active");
        document.getElementById("userTab").classList.remove("active");
    }


    function showWelcome(event) {

        event.preventDefault();

        var form = document.getElementById("userForm");

        var modal = new bootstrap.Modal(
            document.getElementById("welcomeModal")
        );

        modal.show();

        setTimeout(function() {
            form.submit();
        }, 2000);
    }

</script>

</body>
</html>
